calt&quot; 0" fill="#64748b">argv[2]</text><rect x="470" y="80" width="90" height="36" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="515.0" y="104.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">•</text><text x="515.0" y="71" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">argv[3]</text><rect x="560" y="80" width="90" height="36" rx="0" fill="#fee2e2" stroke="#475569" stroke-width="1.6"/><text x="605.0" y="104.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">NULL</text><text x="605.0" y="71" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">argv[4]</text><rect x="205.0" y="180" width="86" height="30" rx="5" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="248.0" y="200" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">./pets\0</text><line x1="245.0" y1="118" x2="248.0" y2="178" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><rect x="307.0" y="180" width="86" height="30" rx="5" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="350.0" y="200" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Cat\0</text><line x1="335.0" y1="118" x2="350.0" y2="178" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><rect x="409.0" y="180" width="86" height="30" rx="5" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="452.0" y="200" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Dog\0</text><line x1="425.0" y1="118" x2="452.0" y2="178" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><rect x="511.0" y="180" width="86" height="30" rx="5" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="554.0" y="200" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Parrot\0</text><line x1="515.0" y1="118" x2="554.0" y2="178" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><text x="20" y="245" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">argv[0] is the program name; argv[1] to argv[argc-1] are the arguments; argv[argc] is always NULL.</text></svg>
