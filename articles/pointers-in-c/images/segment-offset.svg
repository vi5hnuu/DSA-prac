font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">0000:0120</text><text x="140" y="268" font-size="10.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">0000 × 16 + 0120</text><rect x="280" y="232" width="220" height="40" rx="6" fill="#fbcfe8" stroke="#475569" stroke-width="2"/><text x="390" y="252" font-size="14" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">0010:0020</text><text x="390" y="268" font-size="10.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">0100 + 0020</text><rect x="530" y="232" width="220" height="40" rx="6" fill="#fbcfe8" stroke="#475569" stroke-width="2"/><text x="640" y="252" font-size="14" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">0012:0000</text><text x="640" y="268" font-size="10.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">0120 + 0000</text></svg>
