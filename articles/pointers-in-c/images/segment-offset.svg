<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="The segment B000 is shifted left by one hex digit to B0000 and the offset 8000 is added, giving the 20-bit physical address B8000. Below, three different segment:offset pairs all reach physical address 00120"><title>Segment plus offset</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="780" height="300" rx="12" fill="#f8fafc"/><text x="20" y="28" font-size="14" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Physical address = segment × 16 + offset</text><text x="240" y="69" font-size="13" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">segment B000, shifted:</text><rect x="260" y="45" width="40" height="34" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="280.0" y="68.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">B</text><rect x="300" y="45" width="40" height="34" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="320.0" y="68.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">0</text><rect x="340" y="45" width="40" height="34" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="360.0" y="68.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">0</text><rect x="380" y="45" width="40" height="34" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="400.0" y="68.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">0</text><rect x="420" y="45" width="40" height="34" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="440.0" y="68.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">0</text><text x="240" y="114" font-size="13" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">+ offset 8000:</text><rect x="260" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="280.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings: