l="#0f172a" font-weight="700">Each entry holds the number of the NEXT cluster of the file; FFF marks the last one. Clusters 3 → 5 → 6 → 8.</text><text x="20" y="278" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">Entries 0 and 1 are reserved: the media descriptor (F0 for a 1.44 MB floppy) and filler bytes.</text></svg>
