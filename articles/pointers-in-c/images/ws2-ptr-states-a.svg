<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Starting at p[0]: after ptr++ it points to p[1]; after *ptr++ to p[2]; after *++ptr to p[3]; then ++*ptr changes p[3] itself from v + 3 to v + 4"><title>ptr moving through p</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="760" height="330" rx="12" fill="#f8fafc"/><text x="20" y="26" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">p holds v + 0 … v + 4 (addresses into v). The box outlined in purple is where ptr points.</text><text x="20" y="74" font-size="17" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">ptr++</text><rect x="170" y="50" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="207.0" y="73.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 0</text><rect x="244" y="50" width="74" height="34" rx="0" fill="#fde68a" stroke="#7c3aed" stroke-width="3"/><text x="281.0" y="73.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 1</text><rect x="318" y="50" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="355.0" y="73.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 2</text><rect x="392" y="50" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="429.0" y="73.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 3</text><rect x="466" y="50" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="503.0" y="73.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 4</text><text x="281.0" y="100" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">ptr</text><text x="554" y="72" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">ptr moved to p[1]</text><text x="20" y="138" font-size="17" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">* ptr++</text><rect x="170" y="114" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="207.0" y="137.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 0</text><rect x="244" y="114" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="281.0" y="137.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 1</text><rect x="318" y="114" width="74" height="34" rx="0" fill="#fde68a" stroke="#7c3aed" stroke-width="3"/><text x="355.0" y="137.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 2</text><rect x="392" y="114" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="429.0" y="137.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 3</text><rect x="466" y="114" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="503.0" y="137.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 4</text><text x="355.0" y="164" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">ptr</text><text x="554" y="136" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">ptr moved to p[2]</text><text x="20" y="202" font-size="17" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">* ++ptr</text><rect x="170" y="178" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="207.0" y="201.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 0</text><rect x="244" y="178" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="281.0" y="201.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 1</text><rect x="318" y="178" width="74" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="355.0" y="201.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 2</text><rect x="392" y="178" width="74