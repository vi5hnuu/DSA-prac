" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="503.0" y="265.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">v + 4</text><text x="429.0" y="292" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">ptr</text><text x="554" y="264" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c">p[3] itself changed to v + 4</text></svg>
