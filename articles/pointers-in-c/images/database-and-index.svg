ont-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a">record r starts at:  header + descriptors + (r − 1) × record size</text><text x="20" y="160" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Index file (on name)</text><rect x="20" y="175" width="80" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="60.0" y="200.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">&quot;name&quot;</text><text x="60.0" y="229" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">field</text><rect x="100" y="175" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="140.0" y="200.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">2</text><text x="140.0" y="229" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">Anita</text><rect x="180" y="175" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="220.0" y="200.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">4</text><text x="220.0" y="229" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">Karan</text><rect x="260" y="175" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="300.0" y="200.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">5</text><text x="300.0" y="229" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">Meena</text><rect x="340" y="175" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="380.0" y="200.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">1</text><text x="380.0" y="229" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">Ravi</text><rect x="420" y="175" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="460.0" y="200.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">3</text><text x="460.0" y="229" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">Zoya</text><text x="520" y="190" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">To list in name order: read 2, jump</text><text x="520" y="210" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">to record 2 and print it; read 4 …</text><text x="20" y="262" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">The index stores only record NUMBERS: sorting it never moves the records themselves,</text><text x="20" y="282" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">and one database can have several indexes, one per field.</text></svg>
