pad</text><text x="646.0" y="68" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">a1.bal</text><text x="20" y="165" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">The members are stored in the order they are declared, one after another.</text><text x="20" y="187" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">The compiler may insert unused padding bytes so that each member starts at an address</text><text x="20" y="207" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">suited to its type: here 1 byte, so the 4-byte float bal starts at a multiple of 4.</text><text x="20" y="232" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">(Numbers under the cells are byte offsets from the start of a1.)</text></svg>
