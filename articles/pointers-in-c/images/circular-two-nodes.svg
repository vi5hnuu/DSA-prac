<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" role="img" aria-label="Node 10 links to node 20 and node 20 links back to node 10, so p never becomes NULL"><title>Two nodes linked in a circle</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="600" height="170" rx="12" fill="#f8fafc"/><rect x="120" y="60" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="143.0" y="81.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">10</text><rect x="166" y="60" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="360" y="60" width="46" height="32" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.8"/><text x="383.0" y="81.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">20</text><rect x="406" y="60" width="34" height="32" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.8"/><line x1="183.0" y1="76.0" x2="358" y2="76.0" stroke="#475569" stroke-width="2" marker-end="url(#m_grey)"/><path d="M423.0,92 Q330,150 143.0,94" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#m_red)"/><text x="143.0" y="34" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">p</text><line x1="143.0" y1="40" x2="143.0" y2="57" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="383.0" y="34" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">q</text><line x1="383.0" y1="40" x2="383.0" y2="57" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="20" y="160" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">No link is NULL, so  while (p != NULL)  never stops: p toggles between the two nodes forever.</text></svg>
