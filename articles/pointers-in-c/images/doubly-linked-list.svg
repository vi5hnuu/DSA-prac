" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">p</text><line x1="116.0" y1="124" x2="116.0" y2="105" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="20" y="160" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">Grey arrows: next links (forwards).  Purple arrows: prev links (backwards).  N = NULL.</text><text x="20" y="182" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">From any node you can move either way, at the cost of one extra pointer per node.</text></svg>
