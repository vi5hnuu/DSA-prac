<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="Four nodes 20, 15, 70, 60; each has a prev link to the node before and a next link to the node after; the first prev and last next are NULL"><title>A doubly linked list</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="760" height="200" rx="12" fill="#f8fafc"/><rect x="70" y="70" width="26" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="83.0" y="91.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">N</text><rect x="96" y="70" width="40" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="116.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">20</text><rect x="136" y="70" width="26" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="202" y="70" width="26" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="215.0" y="91.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><rect x="228" y="70" width="40" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="248.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">15</text><rect x="268" y="70" width="26" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="334" y="70" width="26" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="347.0" y="91.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><rect x="360" y="70" width="40" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="380.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">70</text><rect x="400" y="70" width="26" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="466" y="70" width="26" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="479.0" y="91.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><rect x="492" y="70" width="40" height="32" rx="0" fill="#d