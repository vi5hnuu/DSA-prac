<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-label="To insert 42 into 17 29 63 85, temp walks until temp-&gt;data is at most 42 and the next node is larger: it stops at 29, and the new node is linked between 29 and 63"><title>Inserting into a sorted list</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="720" height="270" rx="12" fill="#f8fafc"/><text x="20" y="24" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">add(&amp;p, 42): find the node after which 42 belongs</text><rect x="40" y="50" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="63.0" y="71.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">17</text><rect x="86" y="50" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="160" y="50" width="46" height="32" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.8"/><text x="183.0" y="71.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">29</text><rect x="206" y="50" width="34" height="32" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.8"/><rect x="280" y="50" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="303.0" y="71.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">63</text><rect x="326" y="50" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="400" y="50" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="423.0" y="71.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">85</text><rect x="446" y="50" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="463.0" y="71.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">N</text><line x1="103.0" y1="66.0" x2="158" y2="66.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="223.0" y1="66.0" x2="278" y2="66.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="343.0" y1="66.0" x2="398" y2="66.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><text x="183.0" y="118" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">temp</text><line x1="183.0" y1="104" x2="183.0" y2="85" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="244" y="130" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#2563eb" font-weight="700">29 &lt;= 42  and  63 &gt; 42   → stop here</text><text x="20" y="175" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">After  r-&gt;link = temp-&gt;link;  temp-&gt;link = r;</text><rect x="40" y="195" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="63.0" y="216.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">17</text><rect x="86" y="195" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="160" y="195" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="183.0" y="216.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">29</text><rect x="206" y="195" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="280" y="195" width="46" height="32" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.8"/><text x="303.0" y="216.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">42</text><rect x="326" y="195" width="34" height="32" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.8"/><rect x="400" y="195" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="423.0" y="216.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">63</text><rect x="446" y="195" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="520" y="195" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="543.0" y="216.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">85</text><rect x="566" y="195" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="583.0" y="216.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">N</text><line x1="103.0" y1="211.0" x2="158" y2="211.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="223.0" y1="211.0" x2="278" y2="211.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="343.0" y1="211.0" x2="398" y2="211.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="463.0" y1="211.0" x2="518" y2="211.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><text x="20" y="256" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">A value smaller than the first node (or an empty list) is handled first: the new node simply becomes the first node.</text></svg>
