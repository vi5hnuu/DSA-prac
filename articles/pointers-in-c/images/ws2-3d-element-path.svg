]</text><text x="600" y="142" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#334155" font-weight="700">t[2]</text><line x1="488" y1="44" x2="488" y2="86" stroke="#2563eb" stroke-width="2" marker-end="url(#m_blue)"/><text x="482" y="50" font-size="12" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">*(t + 2)  → +64</text><line x1="600" y1="44" x2="600" y2="86" stroke="#b45309" stroke-width="2" marker-end="url(#m_orange)"/><text x="606" y="50" font-size="12" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#b45309" font-weight="700">*(*(t + 2) + 1)  → +80</text><text x="698.0" y="142" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">+92</text><text x="20" y="186" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">*(*(*(t + 2) + 1) + 3): skip 2 blocks (2 × 8 ints), then 1 row (4 ints), then 3 more ints:</text><text x="20" y="208" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">element 2×8 + 1×4 + 3 = 23, at byte 92 — the value 4. Exactly t[2][1][3].</text></svg>
