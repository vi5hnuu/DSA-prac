<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Array arr of 8 ints; each pass p moves one element and i grows by one, so p + i lands on elements 0, 2 and 4; the loop stops when p + i reaches element 6"><title>p moves 1, p + i moves 2</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="640" height="280" rx="12" fill="#f8fafc"/><text x="48" y="64.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">arr</text><rect x="60" y="40" width="64" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="92.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">6</text><text x="92.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">[0]</text><rect x="124" y="40" width="64" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="156.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">12</text><text x="156.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">[1]</text><rect x="188" y="40" width="64" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="220.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">18</text><text x="220.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">[2]</text><rect x="252" y="40" width="64" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="284.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">24</text><text x="284.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">[3]</text><rect x="316" y="40" width="64" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="348.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">30</text><text x="348.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">[4]</text><rect x="380" y="40" width="64" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="412.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">36</text><text x="412.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">[5]</text><rect x="444" y="40" width="64" height="38" rx="0" fill="#fee2e2" stroke="#475569" stroke-width="1.6"/><text x="476.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">42</text><text x="476.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">[6]</text><rect x="508" y="40" width="64" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="540.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">48</text><text x="540.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">[7]</text><line x1="92.0" y1="116" x2="92.0" y2="84" stroke="#15803d" stroke-width="2.5" marker-end="url(#m_green)"/><line x1="220.0" y1="116" x2="220.0" y2="84" stroke="#15803d" stroke-width="2.5" marker-end="url(#m_green)"/><line x1="348.0" y1="116" x2="348.0" y2="84" stroke="#15803d" stroke-width="2.5" marker-end="url(#m_green)"/><text x="476.0" y="104" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">stop here</text><text x="20" y="150" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a">pass 1: p = arr,     i = 0  →  p + i = arr + 0</text><text x="20" y="178" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a">pass 2: p = arr + 1, i = 1  →  p + i = arr + 2</text><text x="20" y="206" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a">pass 3: p = arr + 2, i = 2  →  p + i = arr + 4</text><text x="20" y="234" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b91c1c">next:   p = arr + 3, i = 3  →  p + i = arr + 6 &gt; arr + 4: stop</text></svg>
