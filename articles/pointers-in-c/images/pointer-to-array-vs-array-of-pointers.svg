<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" role="img" aria-label="Left: int (*rp)[4] is one pointer to a block of four ints. Right: int *ap[4] is an array of four pointers, each pointing to its own int"><title>Pointer to an array vs array of pointers</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect width="680" height="240" rx="12" fill="#f8fafc"/><text x="160" y="34" font-size="16" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">int (*rp)[4];</text><text x="160" y="54" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b45309">ONE pointer → an array of 4 ints</text><rect x="110" y="70" width="100" height="36" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="160" y="94" font-size="14" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">rp</text><rect x="60" y="150" width="50" height="36" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><rect x="110" y="150" width="50" height="36" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><rect x="160" y="150" width="50" height="36" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><rect x="210" y="150" width="50" height="36" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><line x1="160" y1="108" x2="85" y2="146" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><path d="M60,196 h200" stroke="#2563eb" stroke-width="2"/><text x="160" y="214" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb">rp + 1 jumps all 4</text><line x1="330" y1="20" x2="330" y2="230" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/><text x="510" y="34" font-size="16" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#7c3aed" font-weight="700">int *ap[4];</text><text x="510" y="54" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed">an ARRAY of 4 pointers to int</text><rect x="410" y="70" width="50" height="36" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/><text x="435" y="94" font-size="18" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">•</text><rect x="380" y="154" width="44" height="32" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><line x1="435" y1="108" x2="402" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><rect x="460" y="70" width="50" height="36" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/><text x="485" y="94" font-size="18" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">•</text><rect x="458" y="154" width="44" height="32" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><line x1="485" y1="108" x2="480" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><rect x="510" y="70" width="50" height="36" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/><text x="535" y="94" font-size="18" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">•</text><rect x="536" y="154" width="44" height="32" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><line x1="535" y1="108" x2="558" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><rect x="560" y="70" width="50" height="36" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/><text x="585" y="94" font-size="18" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">•</text><rect x="614" y="154" width="44" height="32" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><line x1="585" y1="108" x2="636" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="510" y="214" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb">four separate ints, anywhere in memory</text></svg>
