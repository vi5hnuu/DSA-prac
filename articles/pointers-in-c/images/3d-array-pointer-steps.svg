"#b45309" stroke-width="2.5" marker-end="url(#ao)"/><text x="149.5" y="160" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">*stock + 1</text><text x="239.5" y="160" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b45309">→ next row (+16 bytes)</text><line x1="357.5" y1="186" x2="357.5" y2="84" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ap)"/><text x="365.5" y="200" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#7c3aed" font-weight="700">stock + 1</text><text x="447.3" y="200" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed">→ next block (+48 bytes)</text><line x1="33.5" y1="230" x2="33.5" y2="84" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ag)"/><text x="41.5" y="240" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569" font-weight="700">stock, *stock, **stock  (start)</text><text x="20" y="272" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">What differs is the size of the thing each expression points to: an int, a row of 4 ints, or a block of 3 rows.</text></svg>
