ter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">2</text><rect x="101" y="50" width="27" height="30" fill="#dbeafe" fill-opacity="1" stroke="#475569" stroke-width="1"/><text x="114.5" y="70" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">6</text><rect x="128" y="50" width="27" height="30" fill="#fde68a" fill-opacity="1" stroke="#475569" stroke-width="1"/><text x="141.5" y="70" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">7</text><rect x="155" y="50" width="27" height="30" fill="#fde68a" fill-opacity="1" stroke="#475569" stroke-width="1"/><text x="168.5" y="70" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">1</text><rect x="182" y="50" width="27" height="30" fill="#fde68a" fill-opacity="1" stroke="#475569" stroke-width="1"/><text x="195.5" y="70" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">9</text><rect x="209" y="50" width="27" height="30" fill="#fde68a" fill-opacity="1" stroke="#475569" stroke-width="1"/><text x="222.5" y="70" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">4</text><rect x="236" y="50" width="27" height="30" fill="#fbcfe8" fill-opacity="1" stroke="#475569" stroke-width="1"/><text x="249.5" y="70" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">3</text><rect x="263" y="50" width="27" height="30" fill="#fbcfe8" fill-opacity="1" stroke="#475569" stroke-width="1"/><text x="276.5" y="70" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">6</text><rect x="290" y="50" width="27" height="30" fill="#fbcfe8" fill-opacity="1" stroke="#475569" stroke-width="1"/><text x="303.5" y=