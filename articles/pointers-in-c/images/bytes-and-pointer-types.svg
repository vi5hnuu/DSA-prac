<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="A char uses 1 byte, an int 4 bytes and a double 8 bytes; each pointer stores only the first address, and its type decides how many bytes are read"><title>Bytes read through char, int and double pointers</title><rect width="700" height="330" rx="12" fill="#f8fafc"/><text x="20" y="60" font-size="15" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">grade</text><text x="20" y="78" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">char</text><text x="100" y="32" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">value 'B' occupies 1 byte</text><rect x="100" y="40" width="44" height="32" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="122.0" y="88" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">5000</text><text x="470" y="52" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">grade_ptr holds 5000</text><text x="470" y="70" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#1d4ed8">*grade_ptr reads 1 byte</text><text x="20" y="152" font-size="15" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">pages</text><text x="20" y="170" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">int</text><text x="100" y="124" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">value 320 occupies 4 bytes</text><rect x="100" y="132" width="44" height="32" fill="#fde68a" stroke="#475569" stroke-width="1.5"/><text x="122.0" y="180" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">6000</text><rect x="144" y="132" width="44" height="32" fill="#fde68a" stroke="#475569" stroke-width="1.5"/><text x="166.0" y="180" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">6001</text><rect x="188" y="132" width="44" height="32" fill="#fde68a" stroke="#475569" stroke-width="1.5"/><text x="210.0" y="180" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">6002</text><rect x="232" y="132" width="44" height="32" fill="#fde68a" stroke="#475569" stroke-width="1.5"/><text x="254.0" y="180" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">6003</text><text x="470" y="144" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">pages_ptr holds 6000</text><text x="470" y="162" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#1d4ed8">*pages_ptr reads 4 bytes</text><text x="20" y="244" font-size="15" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">price</text><text x="20" y="262" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">double</text><text x="100" y="216" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">value 4.75 occupies 8 bytes</text><rect x="100" y="224" width="44" height="32" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="122.0" y="272" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7000</text><rect x="144" y="224" width="44" height="32" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="166.0" y="272" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7001</text><rect x="188" y="224" width="44" height="32" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="210.0" y="272" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7002</text><rect x="232" y="224" width="44" height="32" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="254.0" y="272" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7003</text><rect x="276" y="224" width="44" height="32" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="298.0" y="272" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7004</text><rect x="320" y="224" width="44" height="32" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="342.0" y="272" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7005</text><rect x="364" y="224" width="44" height="32" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="386.0" y="272" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7006</text><rect x="408" y="224" width="44" height="32" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="430.0" y="272" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7007</text><text x="470" y="236" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">price_ptr holds 7000</text><text x="470" y="254" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#1d4ed8">*price_ptr reads 8 bytes</text><text x="20" y="312" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">A pointer stores only the first (base) address; its type decides how many bytes * reads. Addresses are illustrative.</text></svg>
