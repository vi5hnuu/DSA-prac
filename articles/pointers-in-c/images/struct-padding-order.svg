"#0f172a">Dashed grey cells are padding. Ordering members from largest to smallest often removes most of it.</text><text x="20" y="227" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">(Typical 64-bit system: int 4 bytes, double 8 bytes, each aligned to its own size.)</text></svg>
