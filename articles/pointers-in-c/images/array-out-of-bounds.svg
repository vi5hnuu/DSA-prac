<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 598 250" width="598" height="250" role="img" aria-label="An array scores of five ints, indexes 0 to 4, followed by memory that belongs to something else; a loop using less-than-or-equal writes into that sixth slot"><title>Writing past the end of an array</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="598" height="250" rx="12" fill="#f8fafc"/><text x="20" y="98" font-size="15" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">scores</text><text x="139.0" y="58" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" fill="#475569">[0]</text><rect x="100" y="70" width="78" height="44" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="139.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">0</text><text x="217.0" y="58" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" fill="#475569">[1]</text><rect x="178" y="70" width="78" height="44" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="217.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">10</text><text x="295.0" y="58" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" fill="#475569">[2]</text><rect x="256" y="70" width="78" height="44" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="295.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">20</text><text x="373.0" y="58" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" fill="#475569">[3]</text><rect x="334" y="70" width="78" height="44" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="373.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">30</text><text x="451.0" y="58" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" fill="#475569">[4]</text><rect x="412" y="70" width="78" height="44" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="451.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">40</text><text x="529.0" y="58" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" fill="#b91c1c" font-weight="700">[5]</text><rect x="490" y="70" width="78" height="44" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><text x="529.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">?</text><path d="M100,130 h390" stroke="#15803d" stroke-width="2"/><text x="295.0" y="150" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d">the 5 elements you own: indexes 0 to 4</text><text x="529.0" y="136" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">not yours</text><text x="529.0" y="154" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c">other data</text><text x="20" y="192" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none" fill="#0f172a">for (i = 0; i &lt;= 5; i++) scores[i] = ...;</text><text x="20" y="210" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c">The condition i &lt;= 5 lets i reach 5, one past the last valid index.</text><text x="20" y="232" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">C does not check indexes: the extra write silently overwrites whatever lives next door.</text></svg>
