<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Owl and Oak are compared pair by pair; O equals O, then w (119) differs from a (97), so the result is positive"><title>How strcmp decides</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="640" height="250" rx="12" fill="#f8fafc"/><text x="108" y="63.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">s1</text><rect x="120" y="40" width="60" height="36" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="150.0" y="64.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">O</text><rect x="180" y="40" width="60" height="36" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="210.0" y="64.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">w</text><rect x="240" y="40" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="270.0" y="64.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">l</text><rect x="300" y="40" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="330.0" y="64.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">\0</text><text x="108" y="153.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">s2</text><rect x="120" y="130" width="60" height="36" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="150.0" y="154.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">O</text><rect x="180" y="130" width="60" height="36" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="210.0" y="154.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">a</text><rect x="240" y="130" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="270.0" y="154.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">k</text><rect x="300" y="130" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="330.0" y="154.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">\0</text><text x="150.0" y="100" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d" font-weight="700">equal</text><text x="210.0" y="100" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b45309" font-weight="700">differ!</text><text x="380" y="70" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">&#x27;w&#x27; is 119</text><text x="380" y="152" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">&#x27;a&#x27; is 97</text><text x="20" y="200" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">Compare until the first mismatch (or both reach &#x27;\0&#x27; → equal → 0).</text><text x="20" y="222" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">Result: &#x27;w&#x27; − &#x27;a&#x27; &gt; 0, so &quot;Owl&quot; comes after &quot;Oak&quot;. Only the sign is guaranteed, not the exact number.</text></svg>
