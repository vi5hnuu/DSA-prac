"2" marker-end="url(#m_blue)"/><line x1="70" y1="68" x2="154" y2="68" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m_purple)"/><text x="62" y="73" font-size="12" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">rp</text><line x1="70" y1="140" x2="154" y2="140" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m_purple)"/><text x="62" y="145" font-size="12" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">rp + 1</text><line x1="70" y1="212" x2="154" y2="212" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m_purple)"/><text x="62" y="217" font-size="12" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">rp + 2</text><text x="20" y="274" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">rows[i] holds the address where row i of a starts, so *rows[i] is the first element of row i.</text><text x="20" y="296" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">rp walks down rows; **rp follows two arrows: rp → rows[k] → a[k][0]  (11, 21, 31).</text></svg>
