" font-size="14" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">char const *r</text><text x="220" y="155" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">same as const char *</text><rect x="446" y="138" width="68" height="24" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="480" y="155" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">NO</text><rect x="586" y="138" width="68" height="24" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="620" y="155" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d" font-weight="700">yes</text><rect x="20" y="174" width="690" height="36" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="197" font-size="14" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">char *const t</text><text x="220" y="197" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">const pointer to char</text><rect x="446" y="180" width="68" height="24" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="480" y="197" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d" font-weight="700">yes</text><rect x="586" y="180" width="68" height="24" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="620" y="197" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">NO</text><rect x="20" y="216" width="690" height="36" rx="0" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="239" font-size="14" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">const char *const u</text><text x="220" y="239" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">const pointer to const char</text><rect x="446" y="222" width="68" height="24" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="480" y="239" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">NO</text><rect x="586" y="222" width="68" height="24" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="620" y="239" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">NO</text><text x="20" y="282" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">Rule: const before the * locks the chars; const after the * locks the pointer itself.</text></svg>
