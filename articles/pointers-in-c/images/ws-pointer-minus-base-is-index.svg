<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" aria-label="For each element, subtracting arr from a pointer to it gives its index 0 to 4; arr[ptr - arr] is the element itself"><title>ptr - arr is the index</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="560" height="210" rx="12" fill="#f8fafc"/><text x="98" y="74.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">arr</text><rect x="110" y="50" width="80" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="150.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">6</text><text x="150.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[0]</text><text x="150.0" y="104" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">arr + 0</text><rect x="190" y="50" width="80" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="230.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">12</text><text x="230.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[1]</text><text x="230.0" y="104" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">arr + 1</text><rect x="270" y="50" width="80" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="310.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">18</text><text x="310.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[2]</text><text x="310.0" y="104" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">arr + 2</text><rect x="350" y="50" width="80" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="390.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">24</text><text x="390.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[3]</text><text x="390.0" y="104" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">arr + 3</text><rect x="430" y="50" width="80" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="470.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">30</text><text x="470.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[4]</text><text x="470.0" y="104" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">arr + 4</text><text x="98" y="134" font-size="12" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">ptr - arr</text><text x="150.0" y="134" font-size="15" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">0</text><text x="230.0" y="134" font-size="15" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">1</text><text x="310.0" y="134" font-size="15" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">2</text><text x="390.0" y="134" font-size="15" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">3</text><text x="470.0" y="134" font-size="15" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">4</text><text x="20" y="176" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">Subtracting two pointers into the same array gives the number of elements between them,</text><text x="20" y="196" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">so ptr - arr is exactly the index of the element ptr points to.</text></svg>
