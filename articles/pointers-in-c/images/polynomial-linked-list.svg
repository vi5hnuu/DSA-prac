<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="4x^5 + 2.5x^4 - 3x^2 + 6x + 1 stored as five nodes, each holding a coefficient, an exponent and a link, in descending order of exponent"><title>A polynomial as a linked list</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="780" height="250" rx="12" fill="#f8fafc"/><text x="20" y="28" font-size="15" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">4x^5 + 2.5x^4 - 3x^2 + 6x + 1</text><rect x="70" y="80" width="44" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="92.0" y="101.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">4</text><rect x="114" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="131.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">5</text><rect x="148" y="80" width="30" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="206" y="80" width="44" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="228.0" y="101.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">2.5</text><rect x="250" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="267.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">4</text><rect x="284" y="80" width="30" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="342" y="80" width="44" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="364.0" y="101.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">-3</text><rect x="386" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="403.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">2</text><rect x="420" y="80" width="30" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="478" y="80" width="44" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="500.0" y="101.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">6</text><rect x="522" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="539.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">1</text><rect x="556" y="80" width="30" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="614" y="80" width="44" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="636.0" y="101.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">1</text><rect x="658" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="675.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">0</text><rect x="692" y="80" width="30" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="707.0" y="101.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">N</text><line x1="163.0" y1="96.0" x2="204" y2="96.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="299.0" y1="96.0" x2="340" y2="96.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="435.0" y1="96.0" x2="476" y2="96.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="571.0" y1="96.0" x2="612" y2="96.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><text x="92.0" y="70" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b" font-weight="700">coeff</text><text x="131.0" y="70" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b" font-weight="700">exp</text><text x="163.0" y="70" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b" font-weight="700">link</text><text x="30.0" y="72" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">first</text><rect x="8" y="80" width="44" height="32" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="30.0" y="101.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><line x1="54" y1="96" x2="68" y2="96" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="20" y="160" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">Only the terms that exist are stored: there is no node for x^3, because its coefficient is 0.</text><text x="20" y="182" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">The terms are kept in descending order of exponent, so that two polynomials can be</text><text x="20" y="202" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">combined in one pass, like merging two sorted lists.</text></svg>
