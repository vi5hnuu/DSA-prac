<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="Reading the declaration int *ptr: ptr is the variable, *ptr is the value at the address in ptr, and that value is an int">
<title>Reading int *ptr;</title>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="0" y="0" width="640" height="230" rx="12" fill="#f8fafc"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">
  <text x="320" y="58" font-family="JetBrains Mono,Consolas,monospace" font-size="34" font-weight="700" text-anchor="middle"><tspan fill="#2563eb">int</tspan> <tspan fill="#b45309">*</tspan>ptr;</text>
  <line x1="262" y1="72" x2="130" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="322" y1="72" x2="322" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="358" y1="72" x2="510" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#a3)"/>
  <text x="120" y="142" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4ed8">int</text>
  <text x="120" y="162" font-size="13" text-anchor="middle">③ …is an int</text>
  <text x="322" y="142" font-size="15" font-weight="700" text-anchor="middle" fill="#b45309">*ptr</text>
  <text x="322" y="162" font-size="13" text-anchor="middle">② the value at the</text>
  <text x="322" y="179" font-size="13" text-anchor="middle">address stored in ptr…</text>
  <text x="520" y="142" font-size="15" font-weight="700" text-anchor="middle">ptr</text>
  <text x="520" y="162" font-size="13" text-anchor="middle">① the variable being declared</text>
  <text x="320" y="214" font-size="14" text-anchor="middle" fill="#334155">Read together: “the value at the address stored in ptr is an int”.</text>
</g>
</svg>
