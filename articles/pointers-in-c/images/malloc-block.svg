<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-label="The pointer variable marks in main holds address 7200, the start of a block of five ints obtained from malloc on the heap, with steps: malloc, use, free"><title>A block from malloc</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect width="620" height="300" rx="12" fill="#f8fafc"/><rect x="20" y="40" width="200" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="120" y="62" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155" font-weight="700">main’s variables</text><text x="120" y="96" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">marks</text><rect x="70" y="104" width="100" height="38" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="120" y="129" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">7200</text><text x="120" y="170" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">a pointer: 8 bytes</text><rect x="270" y="40" width="330" height="150" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="435" y="62" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d" font-weight="700">memory from malloc (the heap)</text><rect x="290" y="104" width="58" height="38" fill="#dcfce7" stroke="#475569" stroke-width="1.5"/><text x="319" y="129" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">78</text><text x="319" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7200</text><rect x="348" y="104" width="58" height="38" fill="#dcfce7" stroke="#475569" stroke-width="1.5"/><text x="377" y="129" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">64</text><text x="377" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7204</text><rect x="406" y="104" width="58" height="38" fill="#dcfce7" stroke="#475569" stroke-width="1.5"/><text x="435" y="129" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">91</text><text x="435" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7208</text><rect x="464" y="104" width="58" height="38" fill="#dcfce7" stroke="#475569" stroke-width="1.5"/><text x="493" y="129" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">55</text><text x="493" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7212</text><rect x="522" y="104" width="58" height="38" fill="#dcfce7" stroke="#475569" stroke-width="1.5"/><text x="551" y="129" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">82</text><text x="551" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">7216</text><line x1="172" y1="123" x2="284" y2="123" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/><text x="20" y="224" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">1. malloc(n * sizeof *marks) reserves exactly n ints at run time and returns their address.</text><text x="20" y="246" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">2. Check for NULL, then use the block like an array: marks[i] or *(marks + i).</text><text x="20" y="268" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">3. free(marks) gives it back. Until then it stays reserved — even after the function returns.</text></svg>
