<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" role="img" aria-label="main has a[0] = 1 and total at address 7000; bump gets a copy x of a[0] and a pointer y holding 7000, so x = *y += 3 changes total to 13 but only bump&#x27;s copy x"><title>What bump receives</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="660" height="270" rx="12" fill="#f8fafc"/><text x="20" y="30" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155" font-weight="700">in main</text><text x="110" y="58" font-size="13" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">a[0]</text><rect x="120" y="40" width="110" height="36" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="175" y="63" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">1</text><text x="330" y="58" font-size="13" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">total</text><rect x="340" y="40" width="110" height="36" rx="6" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="395" y="63" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">10 → 13</text><text x="395" y="92" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">address 7000</text><text x="20" y="152" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155" font-weight="700">in bump</text><text x="110" y="186" font-size="13" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">x</text><rect x="120" y="168" width="110" height="36" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="175" y="191" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">1 → 13</text><text x="330" y="186" font-size="13" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">y</text><rect x="340" y="168" width="110" height="36" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="395" y="191" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">7000</text><line x1="175" y1="78" x2="175" y2="164" stroke="#475569" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#m_grey)"/><text x="185" y="125" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#475569">a copy of a[0]</text><line x1="395" y1="166" x2="395" y2="100" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m_blue)"/><text x="405" y="135" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb">y points to total</text><text x="20" y="236" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">*y += 3 changes total in main.  x = ... changes only bump&#x27;s own copy — a[0] stays 1.</text></svg>
