<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="Memory map: marks holds 88 at address 3000; ptr holds 3000 at address 4200; pptr holds 4200 at address 5600">
<title>Memory map of marks, ptr and pptr</title>
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="640" height="230" rx="12" fill="#f8fafc"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">
  <text x="110" y="42" font-size="17" font-weight="700" text-anchor="middle">marks</text>
  <text x="110" y="60" font-size="12" text-anchor="middle" fill="#64748b">int</text>
  <rect x="60" y="70" width="100" height="56" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
  <text x="110" y="105" font-size="20" font-weight="600" text-anchor="middle">88</text>
  <text x="110" y="150" font-size="14" text-anchor="middle" fill="#334155">address 3000</text>

  <text x="320" y="42" font-size="17" font-weight="700" text-anchor="middle">ptr</text>
  <text x="320" y="60" font-size="12" text-anchor="middle" fill="#64748b">int *</text>
  <rect x="270" y="70" width="100" height="56" rx="8" fill="#fde68a" stroke="#475569" stroke-width="2"/>
  <text x="320" y="105" font-size="20" font-weight="600" text-anchor="middle">3000</text>
  <text x="320" y="150" font-size="14" text-anchor="middle" fill="#334155">address 4200</text>

  <text x="530" y="42" font-size="17" font-weight="700" text-anchor="middle">pptr</text>
  <text x="530" y="60" font-size="12" text-anchor="middle" fill="#64748b">int **</text>
  <rect x="480" y="70" width="100" height="56" rx="8" fill="#fbcfe8" stroke="#475569" stroke-width="2"/>
  <text x="530" y="105" font-size="20" font-weight="600" text-anchor="middle">4200</text>
  <text x="530" y="150" font-size="14" text-anchor="middle" fill="#334155">address 5600</text>

  <path d="M270,98 L166,98" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a4)"/>
  <path d="M480,98 L376,98" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a4)"/>

  <text x="20" y="186" font-size="14"><tspan font-weight="700">*pptr</tspan> follows one arrow (gives 3000, the value in ptr); <tspan font-weight="700">**pptr</tspan> follows two (gives 88).</text>
  <text x="20" y="214" font-size="12" fill="#64748b">Addresses are illustrations; real ones change from run to run.</text>
</g>
</svg>
