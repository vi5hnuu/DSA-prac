<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="z is a struct outer with members x at offset 0 and y at offset 12; fun receives the address of z.y and subtracts offsetof(struct outer, y) to get the address of z, then reaches z.x"><title>Finding the outer structure from a member</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="760" height="270" rx="12" fill="#f8fafc"/><text x="20" y="28" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">struct outer z;   fun(&amp;z.y);</text><text x="208" y="62" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">z.x  (struct inner1, 12 bytes)</text>