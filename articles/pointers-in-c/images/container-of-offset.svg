ans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">(char *)p − offsetof(struct outer, y)  =  address of z,  so z.x.i, z.x.f, z.x.ch can be set</text><text x="40" y="260" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">Work in char * so that the subtraction counts bytes.</text></svg>
