&quot; 0" fill="#0f172a" font-weight="700">ch</text><rect x="292" y="92" width="84" height="34" rx="0" fill="#f1f5f9" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="376" y="92" width="112" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="432.0" y="84" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">j</text><rect x="488" y="92" width="112" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="544.0" y="84" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">g</text><rect x="600" y="92" width="28" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="614.0" y="84" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">ch</text><rect x="628" y="92" width="84" height="34" rx="0" fill="#f1f5f9" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><text x="40" y="142" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">0</text><text x="152" y="142" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">4</text><text x="264" y="142" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot