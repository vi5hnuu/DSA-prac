<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Five nodes 21 to 25 where the last node links back to the first instead of holding NULL; front points to 21 and rear to 25"><title>A circular linked list</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="760" height="250" rx="12" fill="#f8fafc"/><rect x="120" y="70" width="46" height="32" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.8"/><text x="143.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">21</text><rect x="166" y="70" width="34" height="32" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.8"/><rect x="240" y="70" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="263.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">22</text><rect x="286" y="70" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="360" y="70" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="383.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">23</text><rect x="406" y="70" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="480" y="70" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="503.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">24</text><rect x="526" y="70" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="600" y="70" width="46" height="32" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.8"/><text x="623.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">25</text><rect x="646" y="70" width="34" height="32" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.8"/><line x1="183.0" y1="86.0" x2="238" y2="86.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="303.0" y1="86.0" x2="358" y2="86.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="423.0" y1="86.0" x2="478" y2="86.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="543.0" y1="86.0" x2="598" y2="86.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><path d="M663.0,102 Q403.0,190 143.0,104" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#m_red)"/><text x="143.0" y="40" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">front</text><line x1="143.0" y1="46" x2="143.0" y2="67" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="623.0" y="40" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">rear</text><line x1="623.0" y1="46" x2="623.0" y2="67" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="20" y="228" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">The last link points back to the first node, so no link is NULL. rear-&gt;link is always the front.</text></svg>
