<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="s holds addresses of four strings; ptr holds the addresses of the elements of s in reverse order; p points into ptr"><title>Three levels of pointers to strings</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="760" height="400" rx="12" fill="#f8fafc"/><rect x="40" y="30" width="130" height="30" rx="6" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="105" y="50" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">owl\0</text><rect x="220" y="30" width="130" height="30" rx="6" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="285" y="50" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">raven\0</text><rect x="400" y="30" width="130" height="30" rx="6" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="465" y="50" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">crow\0</text><rect x="580" y="30" width="130" height="30" rx="6" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="645" y="50" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">pigeon\0</text><text x="73" y="152.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">s</text><rect x="85" y="130" width="150" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="160.0" y="153.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">→ &quot;owl&quot;</text><rect x="235" y="130" width="150" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="310.0" y="153.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">→ &quot;raven&quot;</text><rect x="385" y="130" width="150" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="460.0" y="153.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">→ &quot;crow&quot;</text><rect x="535" y="130" width="150" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="610.0" y="153.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">→ &quot;pigeon&quot;</text><text x="90" y="125" font-size="11.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">s[0]</text><text x="240" y="125" font-size="11.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">s[1]</text><text x="390" y="125" font-size="11.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">s[2]</text><text x="540" y="125" font-size="11.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">s[3]</text><line x1="190.0" y1="126" x2="105" y2="64" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><line x1="340.0" y1="126" x2="285" y2="64" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><line x1="490.0" y1="126" x2="465" y2="64" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><line x1="640.0" y1="126" x2="645" y2="64" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><text x="73" y="262.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">ptr</text><rect x="85" y="240" width="150" height="34" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="160.0" y="263.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">s + 3</text><rect x="235" y="240" width="150" height="34" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="310.0" y="263.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">s + 2</text><rect x="385" y="240" width="150" height="34" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="460.0" y="263.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">s + 1</text><rect x="535" y="240" width="150" height="34" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="610.0" y="263.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">s</text><text x="90" y="235" font-size="11.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">ptr[0]</text><text x="240" y="235" font-size="11.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">ptr[1]</text><text x="390" y="235" font-size="11.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">ptr[2]</text><text x="540" y="235" font-size="11.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">ptr[3]</text><line x1="190.0" y1="236" x2="590.0" y2="168" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m_purple)"/><line x1="340.0" y1="236" x2="440.0" y2="168" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m_purple)"/><line x1="490.0" y1="236" x2="290.0" y2="168" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m_purple)"/><line x1="640.0" y1="236" x2="140.0" y2="168" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m_purple)"/><text x="70.0" y="312" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">p</text><rect x="30" y="320" width="80" height="32" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="70.0" y="341.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">ptr</text><line x1="112" y1="336" x2="140.0" y2="280" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#m_red)"/><text x="140" y="330" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">p starts at ptr[0]. Each ++p moves to the next element of ptr;</text><text x="140" y="350" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">one * gives an element of ptr (an address inside s), ** gives a string.</text><text x="140" y="370" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">Watch out: --*++p changes ptr[2] itself, from s + 1 to s.</text></svg>
