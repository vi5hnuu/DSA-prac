<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="A deque with front at 10 and rear at 17; nodes can be added or removed at both ends"><title>A deque</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="800" height="200" rx="12" fill="#f8fafc"/><rect x="150" y="80" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="173.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">10</text><rect x="196" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="254" y="80" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="277.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">11</text><rect x="300" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="358" y="80" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="381.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">12</text><rect x="404" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="462" y="80" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="485.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">13</text><rect x="508" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="566" y="80" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="589.0" y="101.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">17</text><rect x="612" y="80" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="629.0" y="101.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">N</text><line x1="213.0" y1="96.0" x2="252" y2="96.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="317.0" y1="96.0" x2="356" y2="96.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="421.0" y1="96.0" x2="460" y2="96.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="525.0" y1="96.0" x2="564" y2="96.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><text x="173.0" y="46" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">front</text><line x1="173.0" y1="52" x2="173.0" y2="77" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="589.0" y="46" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">rear</text><line x1="589.0" y1="52" x2="589.0" y2="77" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="138" y="96" font-size="12" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#7c3aed" font-weight="700">add / remove ⇄</text><text x="658" y="96" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#7c3aed" font-weight="700">⇄ add / remove</text><text x="20" y="160" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">Removing at the rear needs the node BEFORE rear, so delq_at_end must walk from the front:</text><text x="20" y="182" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">that one operation takes time proportional to the length. (A doubly linked list fixes this.)</text></svg>
