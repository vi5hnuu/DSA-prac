<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="p holds the addresses of a[0], a[2], a[1], a[4], a[3] in that order; after **++ptr, ptr points to p[1], which points to a[2], so **ptr is 12"><title>A shuffled array of pointers</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="640" height="300" rx="12" fill="#f8fafc"/><text x="98" y="64.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">a</text><rect x="110" y="40" width="78" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="149.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">10</text><text x="149.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">a[0]</text><rect x="188" y="40" width="78" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="227.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">11</text><text x="227.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">a[1]</text><rect x="266" y="40" width="78" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="305.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">12</text><text x="305.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">a[2]</text><rect x="344" y="40" width="78" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="383.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">13</text><text x="383.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">a[3]</text><rect x="422" y="40" width="78" height="38" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="461.0" y="65.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">14</text><text x="461.0" y="31" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">a[4]</text><text x="98" y="194.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">p</text><rect x="110" y="170" width="78" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="149.0" y="195.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">a + 0</text><text x="149.0" y="224" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">p[0]</text><rect x="188" y="170" width="78" height="38" rx="0" fill="#fde68a" stroke="#7c3aed" stroke-width="3"/><text x="227.0" y="195.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">a + 2</text><text x="227.0" y="224" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">p[1]</text><rect x="266" y="170" width="78" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="305.0" y="195.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">a + 1</text><text x="305.0" y="224" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">p[2]</text><rect x="344" y="170" width="78" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="383.0" y="195.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">a + 4</text><text x="383.0" y="224" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">p[3]</text><rect x="422" y="170" width="78" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="461.0" y="195.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">a + 3</text><text x="461.0" y="224" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">p[4]</text><line x1="149.0" y1="166" x2="149.0" y2="84" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><line x1="227.0" y1="166" x2="305.0" y2="84" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#m_red)"/><line x1="305.0" y1="166" x2="227.0" y2="84" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><line x1="383.0" y1="166" x2="461.0" y2="84" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><line x1="461.0" y1="166" x2="383.0" y2="84" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><text x="227.0" y="242" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7c3aed" font-weight="700">ptr after **++ptr</text><text x="20" y="272" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">**ptr = a[2] = 12,   ptr - p = 1,   *ptr - a = 2</text></svg>
