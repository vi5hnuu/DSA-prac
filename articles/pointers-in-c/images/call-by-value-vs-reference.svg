<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" aria-label="Call by value copies left and right into first and second, so swapping the copies leaves main unchanged; call by reference passes their addresses, so swapping through the pointers changes left and right"><title>Call by value vs call by reference</title><rect width="700" height="350" rx="12" fill="#f8fafc"/><defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect x="10" y="14" width="330" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="175" y="40" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">Call by value</text><text x="175" y="58" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">exchange(left, right)</text><text x="160" y="86" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">in main</text><text x="80" y="108" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">left</text><rect x="40" y="116" width="80" height="40" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="80" y="142" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">15</text><text x="240" y="108" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">right</text><rect x="200" y="116" width="80" height="40" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="240" y="142" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">40</text><text x="160" y="198" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">in exchange: copies</text><text x="80" y="220" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">first</text><rect x="40" y="228" width="80" height="40" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="80" y="254" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">40</text><text x="240" y="220" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">second</text><rect x="200" y="228" width="80" height="40" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="240" y="254" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">15</text><line x1="80" y1="160" x2="80" y2="204" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a6)"/><line x1="240" y1="160" x2="240" y2="204" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a6)"/><text x="175" y="312" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c">Copies are swapped; left and right stay 15, 40.</text><rect x="360" y="14" width="330" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="525" y="40" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">Call by reference</text><text x="525" y="58" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">exchange(&amp;left, &amp;right)</text><text x="510" y="86" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">in main</text><text x="430" y="108" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">left</text><rect x="390" y="116" width="80" height="40" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="430" y="142" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">40</text><text x="590" y="108" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">right</text><rect x="550" y="116" width="80" height="40" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="590" y="142" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">15</text><text x="510" y="198" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">in exchange: addresses</text><text x="430" y="220" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">first</text><rect x="390" y="228" width="80" height="40" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="430" y="254" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">&amp;left</text><text x="590" y="220" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">second</text><rect x="550" y="228" width="80" height="40" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="590" y="254" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">&amp;right</text><line x1="430" y1="212" x2="430" y2="162" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a5)"/><line x1="590" y1="212" x2="590" y2="162" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a5)"/><text x="525" y="312" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d">*first and *second change left and right.</text></svg>
