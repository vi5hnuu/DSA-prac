<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="Left: deleting the leaf 20 sets the left link of 30 to NULL. Right: deleting 40, which has one child 35, makes the right link of 30 point to 35"><title>Deleting a leaf and a node with one child</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="780" height="250" rx="12" fill="#f8fafc"/><line x1="178.0" y1="62.0" x2="132.0" y2="108.0" stroke="#475569" stroke-width="2"/><line x1="202.0" y1="62.0" x2="248.0" y2="108.0" stroke="#475569" stroke-width="2"/><line x1="251.6" y1="134.8" x2="228.4" y2="175.2" stroke="#475569" stroke-width="2"/><circle cx="190" cy="50" r="17" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="190" y="55" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">30</text><circle cx="120" cy="120" r="17