<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" role="img" aria-label="Three bytes hold two 12-bit entries. Bytes 00 50 00 at offset 3 hold entry 2 (000) and entry 3 (005): entry 2 is the low 12 bits of bytes 3 and 4, entry 3 the high 12 bits of bytes 4 and 5"><title>How 12-bit FAT entries are packed</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="780" height="200" rx="12" fill="#f8fafc"/><text x="20" y="26" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Entries 2 and 3 share bytes 3, 4 and 5 of the FAT. Entry k starts at byte k × 3 / 2:</text><rect x="150" y="60" width="120" height="40" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="210.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">00</text><text x="210.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">byte 3</text><rect x="270" y="60" width="120" height="40" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="330.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">50</text><text x="330.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">byte 4</text><rect x="390" y="60" width="120" height="40" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="450.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">00</text><text x="450.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">byte 5</text><text x="20" y="140" font-size="12.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a">even entry 2: (byte3 | byte4 &lt;&lt; 8) &amp; 0x0FFF  =  0x5000 &amp; 0x0FFF  =  000</text><text x="20" y="166" font-size="12.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a">odd entry 3:  (byte4 | byte5 &lt;&lt; 8) &gt;&gt; 4      =  0x0050 &gt;&gt; 4      =  005</text><text x="20" y="190" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">An even entry is the LOW 12 bits of its two bytes; an odd entry is the HIGH 12 bits.</text></svg>
