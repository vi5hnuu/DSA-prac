<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" role="img" aria-label="The name of int grid[2][3] decays into a pointer to a row of 3 ints, int (*)[3], which points straight at the ints; an int ** would instead have to point at a pointer, which does not exist in a 2-D array"><title>What a 2-D array decays into</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="700" height="280" rx="12" fill="#f8fafc"/><text x="20" y="30" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">int grid[2][3] passed to a function becomes int (*)[3] — a pointer to a row:</text><rect x="220" y="60" width="56" height="34" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="248.0" y="83.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">1</text><rect x="276" y="60" width="56" height="34" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="304.0" y="83.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">2</text><rect x="332" y="60" width="56" height="34" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="360.0" y="83.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">3</text><rect x="388" y="60" width="56" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="416.0" y="83.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">4</text><rect x="444" y="60" width="56" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="472.0" y="83.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">5</text><rect x="500" y="60" width="56" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="528.0" y="83.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">6</text><text x="95.0" y="52" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700"></text><rect x="40" y="60" width="110" height="34" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="95.0" y="82.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">grid</text><line x1="152" y1="77" x2="214" y2="77" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m_blue)"/><text x="304" y="116" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">row 0</text><text x="472" y="116" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">row 1</text><text x="20" y="160" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">An int ** would have to point at a POINTER, which then points at the ints:</text><text x="95.0" y="172" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700"></text><rect x="40" y="180" width="110" height="34" rx="6" fill="#fee2e2" stroke="#475569" stroke-width="2"/><text x="95.0" y="202.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">int **</text><line x1="152" y1="197" x2="214" y2="197" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#m_red)"/><rect x="220" y="180" width="90" height="34" rx="0" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><text x="265" y="203" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">a pointer?</text><text x="330" y="203" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c">— no such pointer exists inside a 2-D array.</text><text x="20" y="256" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">So a 2-D array never decays into a pointer to a pointer; passing it to int ** draws an incompatible-type warning.</text></svg>
