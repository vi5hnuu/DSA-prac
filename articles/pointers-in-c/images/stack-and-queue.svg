r="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#2563eb" font-weight="700">rear</text><line x1="675.0" y1="142" x2="675.0" y2="167" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="415.0" y="236" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">delq: remove here</text><text x="665.0" y="236" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#15803d" font-weight="700">addq: add here</text><text x="20" y="310" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">A stack works at ONE end (last in, first out). A queue adds at one end and removes at the other (first in, first out).</text></svg>
