<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Left: a stack whose top points to 70, then 20, 15, 10; push and pop both happen at the top. Right: a queue with front at 16 and rear at 4; items are added at the rear and removed at the front"><title>A stack and a queue as linked lists</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="760" height="330" rx="12" fill="#f8fafc"/><text x="130" y="26" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Stack (LIFO)</text><rect x="90" y="70" width="46" height="32" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.8"/><text x="113.0" y="91.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">70</text><rect x="136" y="70" width="34" height="32" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.8"/><rect x="90" y="128" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="113.0" y="149.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">20</text><rect x="136" y="128" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><line x1="153.0" y1="102" x2="153.0" y2="126" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><rect x="90" y="186" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="113.0" y="207.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">15</text><rect x="136" y="186" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><line x1="153.0" y1="160" x2="153.0" y2="184" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><rect x="90" y="244" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="113.0" y="265.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">10</text><rect x="136" y="244" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="153.0" y="265.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">N</text><line x1="153.0" y1="218" x2="153.0" y2="242" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><text x="35.0" y="62" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">top</text><rect x="10" y="70" width="50" height="32" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="35.0" y="91.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><line x1="62" y1="86" x2="88" y2="86" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="186" y="82" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#15803d" font-weight="700">push: add here</text><text x="186" y="100" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">pop: remove here</text><text x="555" y="26" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Queue (FIFO)</text><rect x="385" y="170" width="40" height="32" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.8"/><text x="405.0" y="191.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">16</text><rect x="425" y="170" width="30" height="32" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.8"/><rect x="475" y="170" width="40" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="495.0" y="191.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&