<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="A 32-byte circular buffer from 41E to 43D holding two bytes per key, ASCII code then scan code. Head at 41A points to the next key to be read, Z at 41E; tail at 41C points to the next free slot, 420"><title>The keyboard buffer</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="800" height="260" rx="12" fill="#f8fafc"/><text x="80.0" y="82" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">head (41Ah)</text><rect x="30" y="90" width="100" height="32" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="80.0" y="111.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">41E</text><text x="210.0" y="82" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">tail (41Ch)</text><rect x="160" y="90" width="100" height="32" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="210.0" y="111.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">420</text><rect x="300" y="90" width="40" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="320.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">90</text><text x="320.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">41E</text><rect x="340" y="90" width="40" height="34" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="360.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">44</text><text x="360.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">41F</text><rect x="380" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="400.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><text x="400.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">420</text><rect x="420" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="440.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><text x="440.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">421</text><rect x="460" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="480.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><text x="480.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">422</text><rect x="500" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="520.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><text x="520.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">423</text><rect x="540" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="560.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><text x="560.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">424</text><rect x="580" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="600.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><text x="600.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">425</text><rect x="620" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="640.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">…</text><text x="640.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155"></text><rect x="660" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="680.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><text x="680.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">43C</text><rect x="700" y="90" width="40" height="34" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="720.0" y="113.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><text x="720.0" y="140" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">43D</text><path d="M80,74 Q180,30 320.0,86" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m_blue)"/><path d="M210,74 Q300,20 400.0,86" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#m_red)"/><text x="500.0" y="60" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#15803d" font-weight="700">&quot;Z&quot;: ASCII 90, scan code 44 (at the head)</text><text x="20" y="190" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">A key is stored at the tail, and the tail moves on 2 bytes. A key is read at the head, and the head moves on 2 bytes.</text><text x="20" y="212" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">Both wrap round from 43Dh back to 41Eh: a circular queue. head == tail means empty;</text><text x="20" y="232" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">one slot is always left free, so that &quot;full&quot; (tail just behind head) looks different from &quot;empty&quot;.</text></svg>
