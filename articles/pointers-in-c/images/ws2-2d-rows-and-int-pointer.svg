<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" height="230" role="img" aria-label="The 3 by 3 array n stored as 9 ints; n[0], n[1] and n[2] start at byte offsets 0, 12 and 24; ptr = n[0], so ptr[2] is n[0][2] = 1"><title>n[3][3] in memory</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="660" height="230" rx="12" fill="#f8fafc"/><rect x="60" y="70" width="60" height="38" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="90.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">4</text><text x="90.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+0</text><rect x="120" y="70" width="60" height="38" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="150.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">7</text><text x="150.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+4</text><rect x="180" y="70" width="60" height="38" rx="0" fill="#dbeafe" stroke="#b45309" stroke-width="3"/><text x="210.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">1</text><text x="210.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+8</text><rect x="240" y="70" width="60" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="270.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">9</text><text x="270.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+12</text><rect x="300" y="70" width="60" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="330.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">2</text><text x="330.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+16</text><rect x="360" y="70" width="60" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="390.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">6</text><text x="390.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+20</text><rect x="420" y="70" width="60" height="38" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="450.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">3</text><text x="450.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+24</text><rect x="480" y="70" width="60" height="38" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="510.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">8</text><text x="510.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+28</text><rect x="540" y="70" width="60" height="38" rx="0" fill="#fbcfe8" stroke="#7c3aed" stroke-width="3"/><text x="570.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">5</text><text x="570.0" y="124" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">+32</text><line x1="80" y1="30" x2="80" y2="66" stroke="#2563eb" stroke-width="2" marker-end="url(#m_blue)"/><text x="86" y="30" font-size="12" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#2563eb" font-weight="700">n[0]  (+0)</text><line x1="260" y1="30" x2="260" y2="66" stroke="#2563eb" stroke-width="2" marker-end="url(#m_blue)"/><text x="266" y="30" font-size="12" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#2563eb" font-weight="700">n[1]  (+12)</text><line x1="440" y1="30" x2="440" y2="66" stroke="#2563eb" stroke-width="2" marker-end="url(#m_blue)"/><text x="446" y="30" font-size="12" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#2563eb" font-weight="700">n[2]  (+24)</text><text x="210.0" y="148" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">ptr[2]</text><text x="570.0" y="148" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#7c3aed" font-weight="700">n[2][2]</text><text x="20" y="186" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">Rows exist only in our heads: in memory, n is one run of 9 ints. n[i] gives the address where row i starts.</text><text x="20" y="208" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">ptr = n[0] is a plain int pointer to the first element, so ptr[2] is the third int: n[0][2].</text></svg>
