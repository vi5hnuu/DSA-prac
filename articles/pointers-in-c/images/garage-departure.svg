-width="1.8" marker-end="url(#m_grey)"/><text x="294" y="152" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b">← south (entrance)</text><rect x="560" y="110" width="90" height="30" rx="4" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="605" y="130" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">AP11</text><rect x="560" y="140" width="90" height="30" rx="4" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="605" y="160" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">KA02</text><text x="605" y="100" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b45309" font-weight="700">stack (top)</text><text x="20" y="230" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">3. RJ07 leaves; pop AP11, then KA02, adding each at the north end</text><text x="20" y="262" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b">north →</text><rect x="90" y="240" width="60" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="120.0" y="261.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">KA02</text><rect x="150" y="240" width="24" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="198" y="240" width="60" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="228.0" y="261.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">AP11</text><rect x="258" y="240" width="24" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="306" y="240" width="60" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="336.0" y="261.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">SK12</text><rect x="366" y="240" width="24" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="378.0" y="261.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">N</text><line x1="162.0" y1="256.0" x2="196" y2="256.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="270.0" y1="256.0" x2="304" y2="256.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><text x="402" y="262" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b">← south (entrance)</text><text x="20" y="316" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">Pushing reverses the order and popping reverses it back, so the cars end up as they were, minus RJ07.</text></svg>
