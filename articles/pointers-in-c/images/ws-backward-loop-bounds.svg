<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" height="230" role="img" aria-label="The array arr of 5 ints: arr + 5, one past the end, may be formed; arr - 1, one before the start, may not. The safe loop starts at arr + 5 and steps back before each read"><title>Walking backwards safely</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="660" height="230" rx="12" fill="#f8fafc"/><text x="138" y="94.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">arr</text><rect x="150" y="70" width="70" height="38" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="185.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">6</text><text x="185.0" y="61" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[0]</text><rect x="220" y="70" width="70" height="38" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="255.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">12</text><text x="255.0" y="61" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[1]</text><rect x="290" y="70" width="70" height="38" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="325.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">18</text><text x="325.0" y="61" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[2]</text><rect x="360" y="70" width="70" height="38" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="395.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">24</text><text x="395.0" y="61" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[3]</text><rect x="430" y="70" width="70" height="38" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="465.0" y="95.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">30</text><text x="465.0" y="61" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">arr[4]</text><rect x="80" y="70" width="70" height="38" rx="0" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><text x="115" y="95" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">✗</text><text x="115" y="61" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b91c1c" font-weight="700">arr - 1</text><rect x="500" y="70" width="70" height="38" rx="0" fill="#f1f5f9" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/><text x="535" y="95" font-size="16" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d" font-weight="700">✓</text><text x="535" y="61" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#15803d" font-weight="700">arr + 5</text><text x="20" y="150" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d">arr + 5 (one past the end) may be formed and compared — never read.</text><text x="20" y="172" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c">arr - 1 (one before the start) may not even be formed: undefined behaviour.</text><text x="20" y="200" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">So a backward loop starts at arr + 5 and does ptr-- before each read, stopping at arr.</text></svg>
