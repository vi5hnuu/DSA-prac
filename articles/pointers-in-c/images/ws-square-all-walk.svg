<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="The pointer b starts at a[0] and moves one element per loop, squaring each element in place so a becomes 1 4 9 16 25"><title>square_all walks the array</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="560" height="190" rx="12" fill="#f8fafc"/><text x="68" y="74.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">a</text><rect x="80" y="50" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="120.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">1→1</text><text x="120.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">a[0]</text><rect x="160" y="50" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="200.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">2→4</text><text x="200.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">a[1]</text><rect x="240" y="50" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="280.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">3→9</text><text x="280.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">a[2]</text><rect x="320" y="50" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="360.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">4→16</text><text x="360.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">a[3]</text><rect x="400" y="50" width="80" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="440.0" y="75.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">5→25</text><text x="440.0" y="41" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#64748b">a[4]</text><line x1="120.0" y1="140" x2="120.0" y2="96" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m_blue)"/><line x1="200.0" y1="140" x2="200.0" y2="96" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m_blue)"/><line x1="280.0" y1="140" x2="280.0" y2="96" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m_blue)"/><line x1="360.0" y1="140" x2="360.0" y2="96" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m_blue)"/><line x1="440.0" y1="140" x2="440.0" y2="96" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m_blue)"/><text x="120.0" y="160" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#2563eb" font-weight="700">b</text><text x="200.0" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb">b after 1 b++</text><text x="280.0" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb">b after 2 b++</text><text x="360.0" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb">b after 3 b++</text><text x="440.0" y="160" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb">b after 4 b++</text></svg>
