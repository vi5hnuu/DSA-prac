<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270" role="img" aria-label="A 512-byte sector: 446 bytes of boot code, a 64-byte partition table of four 16-byte entries, and the 2-byte signature 55 AA; each entry holds the boot flag, CHS start, type, CHS end, the starting sector and the number of sectors"><title>The master boot record</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="780" height="270" rx="12" fill="#f8fafc"/><text x="20" y="26" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Sector 0 of the disk (512 bytes; widths not to scale):</text><rect x="30" y="60" width="380" height="40" rx="0" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="220.0" y="85" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">446 bytes</text><text x="220.0" y="52" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">boot code (master boot program)</text><text x="30" y="116" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">0</text><rect x="410" y="60" width="260" height="40" rx="0" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="540.0" y="85" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">4 entries × 16 bytes</text><text x="540.0" y="52" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">partition table</text><text x="410" y="116" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">446</text><rect x="670" y="60" width="80" height="40" rx="0" fill="#fee2e2" stroke="#475569" stroke-width="2"/><text x="710.0" y="85" font-size="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">55 AA</text><text x="710.0" y="52" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">signature</text><text x="670" y="116" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">510</text><text x="750" y="116" font-size="11" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">512</text><text x="20" y="160" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">One 16-byte entry:</text><rect x="160" y="180" width="36" height="36" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="178.0" y="203.0" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">80</text><text x="178.0" y="172" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">boot</text><rect x="196" y="180" width="108" height="36" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="250.0" y="172" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">CHS start</text><rect x="304" y="180" width="36" height="36" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="322.0" y="203.0" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">07</text><text x="322.0" y="172" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">type</text><rect x="340" y="180" width="108" height="36" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="394.0" y="172" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">CHS end</text><rect x="448" y="180" width="144" height="36" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="520.0" y="172" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">first sector (LBA)</text><rect x="592" y="180" width="144" height="36" rx="0" fill="#fbcfe8" stroke="#475569" stroke-width="1.6"/><text x="664.0" y="172" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">number of sectors</text><text x="160" y="234" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">0</text><text x="196" y="234" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">1</text><text x="304" y="234" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">4</text><text x="340" y="234" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">5</text><text x="448" y="234" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">8</text><text x="592" y="234" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">12</text><text x="736" y="234" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">16</text><text x="20" y="258" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">Multi-byte numbers are little-endian: the low byte comes first.</text></svg>
