<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="notes.txt at the root with photo.jpg and report.doc and song.mp3 arranged alphabetically; inserting another notes.txt finds the existing node and reports a duplicate"><title>A binary search tree of file names</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="780" height="250" rx="12" fill="#f8fafc"/><line x1="411.1" y1="63.8" x2="528.9" y2="116.2" stroke="#475569" stroke-width="2"/><line x1="534.6" y1="152.6" x2="495.4" y2="187.4" stroke="#475569" stroke-width="2"/><line x1="585.4" y1="152.6" x2="624.6" y2="187.4" stroke="#475569" stroke-width="2"/><circle cx="380" cy="50" r="34" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="380" y="55" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">notes.txt</text><circle cx="560" cy="130" r="34" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="560" y="135" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">report.doc</text><circle cx="470" cy="210" r="34" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="470" y="215" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">photo.jpg</text><circle cx="650" cy="210" r="34" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="650" y="215" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">song.mp3</text><rect x="40" y="30" width="220" height="60" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="2"/><text x="150" y="54" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">insert &quot;notes.txt&quot;</text><text x="150" y="76" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">from /home/asha/old</text><line x1="262" y1="60" x2="342" y2="54" stroke="#b91c1c" stroke-width="2" marker-end="url(#m_red)"/><text x="40" y="130" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">strcmp() == 0 at the root:</text><text x="40" y="150" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">print the original location</text><text x="40" y="168" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">and the duplicate; do not insert.</text><text x="40" y="212" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">Each node stores the name and the</text><text x="40" y="230" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">directory where it was first found.</text></svg>
