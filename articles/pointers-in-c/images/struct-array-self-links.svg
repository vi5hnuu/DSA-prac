><path d="M290.0,118 Q316.0,70 342,118" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m_red)"/><path d="M530.0,118 Q556.0,70 582,118" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m_red)"/><path d="M770.0,118 Q436.0,30 102,118" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m_red)"/><text x="36.0" y="114" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">ptr</text><rect x="8" y="122" width="56" height="32" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="36.0" y="143.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">a</text><line x1="66" y1="138" x2="88" y2="138" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="20" y="250" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">Each element is 24 bytes (8 for z, 4 for i, 4 padding, 8 for p), so a + 1 is 24 bytes past a: the address of a[1].</text><text x="20" y="272" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">The strings themselves live elsewhere; z holds only their addresses.</text></svg>
