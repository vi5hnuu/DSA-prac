<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 238" width="740" height="238" role="img" aria-label="The 12 ints of sales stored in a line; an int pointer ep plus 1 moves to the next int, while a pointer to an array of 4 ints rp plus 1 jumps to the start of the next row"><title>Pointer to an int vs pointer to a row</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="740" height="238" rx="12" fill="#f8fafc"/><text x="20" y="109" font-size="14" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">sales</text><rect x="110" y="86" width="50" height="36" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="135.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">12</text><rect x="160" y="86" width="50" height="36" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="185.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">15</text><rect x="210" y="86" width="50" height="36" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="235.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">11</text><rect x="260" y="86" width="50" height="36" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="285.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">18</text><rect x="310" y="86" width="50" height="36" fill="#fde68a" stroke="#475569" stroke-width="1.5"/><text x="335.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">9</text><rect x="360" y="86" width="50" height="36" fill="#fde68a" stroke="#475569" stroke-width="1.5"/><text x="385.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">14</text><rect x="410" y="86" width="50" height="36" fill="#fde68a" stroke="#475569" stroke-width="1.5"/><text x="435.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">13</text><rect x="460" y="86" width="50" height="36" fill="#fde68a" stroke="#475569" stroke-width="1.5"/><text x="485.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">10</text><rect x="510" y="86" width="50" height="36" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="535.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">20</text><rect x="560" y="86" width="50" height="36" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="585.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">22</text><rect x="610" y="86" width="50" height="36" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="635.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">19</text><rect x="660" y="86" width="50" height="36" fill="#fbcfe8" stroke="#475569" stroke-width="1.5"/><text x="685.0" y="109" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">25</text><line x1="135.0" y1="42" x2="135.0" y2="82" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/><text x="135.0" y="34" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#1d4ed8" font-weight="700">ep</text><line x1="185.0" y1="42" x2="185.0" y2="82" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/><text x="199.0" y="34" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#1d4ed8" font-weight="700">ep + 1</text><text x="220" y="56" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#1d4ed8">int *ep: +1 moves one int (4 bytes)</text><line x1="135.0" y1="168" x2="135.0" y2="128" stroke="#b45309" stroke-width="2.5" marker-end="url(#ag)"/><text x="135.0" y="186" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">rp</text><line x1="335.0" y1="168" x2="335.0" y2="128" stroke="#b45309" stroke-width="2.5" marker-end="url(#ag)"/><text x="335.0" y="186" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">rp + 1</text><line x1="535.0" y1="168" x2="535.0" y2="128" stroke="#b45309" stroke-width="2.5" marker-end="url(#ag)"/><text x="535.0" y="186" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">rp + 2</text><text x="20" y="218" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b45309">int (*rp)[4]: +1 moves one whole row of 4 ints (16 bytes)</text></svg>
