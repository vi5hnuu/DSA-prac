<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 314" width="560" height="314" role="img" aria-label="The array scores of six ints starting at address 8000; the name scores means address 8000, scores plus 3 means the address of element 3, and scores[3], *(scores+3), *(3+scores) and 3[scores] all name the value 90"><title>An array name is its base address</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="560" height="314" rx="12" fill="#f8fafc"/><text x="20" y="98" font-size="15" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">scores</text><text x="145.0" y="60" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[0]</text><rect x="110" y="70" width="70" height="44" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="145.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">72</text><text x="145.0" y="132" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">8000</text><text x="215.0" y="60" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[1]</text><rect x="180" y="70" width="70" height="44" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="215.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">85</text><text x="215.0" y="132" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">8004</text><text x="285.0" y="60" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[2]</text><rect x="250" y="70" width="70" height="44" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="285.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">64</text><text x="285.0" y="132" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">8008</text><text x="355.0" y="60" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[3]</text><rect x="320" y="70" width="70" height="44" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="355.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">90</text><text x="355.0" y="132" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">8012</text><text x="425.0" y="60" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[4]</text><rect x="390" y="70" width="70" height="44" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="425.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">58</text><text x="425.0" y="132" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">8016</text><text x="495.0" y="60" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[5]</text><rect x="460" y="70" width="70" height="44" fill="#ffffff" stroke="#475569" stroke-width="2"/><text x="495.0" y="98" font-size="17" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">77</text><text x="495.0" y="132" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">8020</text><line x1="145.0" y1="188" x2="145.0" y2="144" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/><text x="145.0" y="206" font-size="14" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#1d4ed8" font-weight="700">scores</text><line x1="355.0" y1="188" x2="355.0" y2="144" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/><text x="355.0" y="206" font-size="14" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#1d4ed8" font-weight="700">scores + 3</text><text x="145.0" y="224" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#1d4ed8">= &amp;scores[0] = 8000</text><text x="355.0" y="224" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#1d4ed8">= &amp;scores[3] = 8012</text><rect x="20" y="248" width="510" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="275.0" y="277" font-size="15" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#b45309" font-weight="700">scores[3]  ≡  *(scores + 3)  ≡  *(3 + scores)  ≡  3[scores]  →  90</text></svg>
