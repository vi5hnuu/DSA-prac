<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="The structure b1 occupies bytes 4000 to 4055 with name, author and callno; the pointer ptr, stored separately, holds 4000, the address of b1"><title>A pointer to a structure</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="760" height="260" rx="12" fill="#f8fafc"/><text x="20" y="28" font-size="12.5" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">struct book b1 = {&quot;Deep Waters&quot;, &quot;R. Kapoor&quot;, 204};   struct book *ptr = &amp;b1;</text><rect x="40" y="70" width="250" height="38" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="165.0" y="94.0" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">Deep Waters\0…</text><text x="165.0" y="62" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">b1.name</text><rect x="290" y="70" width="250" height="38" rx="0" fill="#dbeafe" stroke="#475569" stroke-width="1.6"/><text x="415.0" y="94.0" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">R. Kapoor\0…</text><text x="415.0" y="62" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">b1.author</text><rect x="540" y="70" width="20" height="38" rx="0" fill="#f1f5f9" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="560" y="70" width="40" height="38" rx="0" fill="#fde68a" stroke="#475569" stroke-width="1.6"/><text x="580.0" y="94.0" font-size="12.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">204</text><text x="580.0" y="62" font-size="11.5" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">b1.callno</text><text x="40" y="124" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">4000</text><text x="290" y="124" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">4025</text><text x="560" y="124" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">4052</text><text x="85.0" y="162" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">ptr</text><rect x="40" y="170" width="90" height="34" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="85.0" y="192.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">4000</text><text x="85.0" y="219" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">stored at 8000</text><line x1="110" y1="166" x2="150" y2="112" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m_blue)"/><text x="170" y="185" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">ptr-&gt;callno  ≡  (*ptr).callno  ≡  b1.callno  gives 204</text><text x="170" y="208" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">Left of  .  : a structure.      Left of  -&gt;  : a pointer to a structure.</text><text x="170" y="231" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#475569">ptr + 1 would move 56 bytes, one whole struct book (sizeof(struct book) = 56).</text></svg>
