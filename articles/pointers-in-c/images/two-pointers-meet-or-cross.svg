e" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">t</text><path d="M150.0,206 Q176.0,220 192.0,214" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#m_red)"/><path d="M178.0,206 Q152.0,220 136.0,214" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#m_red)"/><text x="20" y="246" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">Use while (s &lt; t): it stops in both cases.</text></svg>
