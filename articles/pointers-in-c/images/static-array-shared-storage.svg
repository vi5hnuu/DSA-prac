<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 232" width="580" height="232" role="img" aria-label="Two pointers, first and second, returned by two calls of squares_upto, both point to the start of the same static table; the second call overwrote element [1][2] from 6 to 60"><title>One static array shared by every call</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="580" height="232" rx="12" fill="#f8fafc"/><text x="378.0" y="56" font-size="14" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#334155" font-weight="700">static int table[2][3]</text><text x="378.0" y="72" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">one copy for the whole program</text><rect x="300" y="80" width="52" height="34" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="326.0" y="103" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">10</text><rect x="352" y="80" width="52" height="34" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="378.0" y="103" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">20</text><rect x="404" y="80" width="52" height="34" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="430.0" y="103" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">30</text><rect x="300" y="114" width="52" height="34" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="326.0" y="137" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">40</text><rect x="352" y="114" width="52" height="34" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="378.0" y="137" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">50</text><rect x="404" y="114" width="52" height="34" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/><text x="430.0" y="137" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">60</text><text x="470" y="136" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">was 6, now 60</text><path d="M150,70 C230,70 250,86 296,86" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><text x="20" y="66" font-size="14" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#2563eb" font-weight="700">first</text><text x="20" y="84" font-size="12" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#2563eb">= squares_upto(1)</text><path d="M150,136 C230,136 250,96 296,96" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ap)"/><text x="20" y="132" font-size="14" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#7c3aed" font-weight="700">second</text><text x="20" y="150" font-size="12" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#7c3aed">= squares_upto(10)</text><text x="20" y="192" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">Both calls return the address of the same static table, so the second call</text><text x="20" y="212" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">overwrites the values the first caller is still looking at.</text></svg>
