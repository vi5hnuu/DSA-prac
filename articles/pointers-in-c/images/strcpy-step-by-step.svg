<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" role="img" aria-label="Characters are copied one at a time from source to target, then a terminating zero is written to end the target"><title>How a string copy works</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="700" height="250" rx="12" fill="#f8fafc"/><text x="20" y="28" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">str_copy(target, source):</text><text x="98" y="73.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">source</text><rect x="110" y="50" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="140.0" y="74.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">O</text><rect x="170" y="50" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="200.0" y="74.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">w</text><rect x="230" y="50" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="260.0" y="74.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">l</text><rect x="290" y="50" width="60" height="36" rx="0" fill="#fee2e2" stroke="#475569" stroke-width="1.6"/><text x="320.0" y="74.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">\0</text><text x="98" y="183.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">target</text><rect x="110" y="160" width="60" height="36" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="140.0" y="184.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">O</text><rect x="170" y="160" width="60" height="36" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="200.0" y="184.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">w</text><rect x="230" y="160" width="60" height="36" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="260.0" y="184.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">l</text><rect x="290" y="160" width="60" height="36" rx="0" fill="#fee2e2" stroke="#475569" stroke-width="1.6"/><text x="320.0" y="184.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">\0</text><rect x="350" y="160" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><text x="380.0" y="184.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">?</text><rect x="410" y="160" width="60" height="36" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440.0" y="184.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">?</text><line x1="140.0" y1="90" x2="140.0" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#m_blue)"/><text x="150.0" y="128" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb" font-weight="700">1</text><line x1="200.0" y1="90" x2="200.0" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#m_blue)"/><text x="210.0" y="128" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb" font-weight="700">2</text><line x1="260.0" y1="90" x2="260.0" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#m_blue)"/><text x="270.0" y="128" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb" font-weight="700">3</text><text x="360.0" y="128" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">4. loop stops at source&#x27;s &#x27;\0&#x27;;</text><text x="360.0" y="144" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">   *t = &#x27;\0&#x27; ends the target</text><text x="410.0" y="214" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">(unused space)</text><text x="20" y="236" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">The target must be big enough for every char plus the terminator — the copy itself never checks.</text></svg>
