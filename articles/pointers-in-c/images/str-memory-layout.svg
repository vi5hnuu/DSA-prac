<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="The array lang holds P A S C A L and a terminating zero byte in 7 consecutive bytes at addresses 4001 to 4007"><title>A string in memory</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="640" height="250" rx="12" fill="#f8fafc"/><text x="20" y="30" font-size="13" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">char lang[] = &quot;PASCAL&quot;;   — 6 letters + 1 terminator = 7 bytes</text><text x="78" y="85.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">lang</text><rect x="90" y="60" width="64" height="40" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="122.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">P</text><text x="122.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">[0]</text><text x="122.0" y="116" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">4001</text><rect x="154" y="60" width="64" height="40" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="186.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">A</text><text x="186.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">[1]</text><text x="186.0" y="116" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">4002</text><rect x="218" y="60" width="64" height="40" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="250.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">S</text><text x="250.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">[2]</text><text x="250.0" y="116" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">4003</text><rect x="282" y="60" width="64" height="40" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="314.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">C</text><text x="314.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">[3]</text><text x="314.0" y="116" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">4004</text><rect x="346" y="60" width="64" height="40" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="378.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">A</text><text x="378.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">[4]</text><text x="378.0" y="116" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">4005</text><rect x="410" y="60" width="64" height="40" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="442.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">L</text><text x="442.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">[5]</text><text x="442.0" y="116" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">4006</text><rect x="474" y="60" width="64" height="40" rx="0" fill="#fee2e2" stroke="#475569" stroke-width="1.6"/><text x="506.0" y="86.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">\0</text><text x="506.0" y="51" font-size="12" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#64748b">[6]</text><text x="506.0" y="116" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">4007</text><text x="506.0" y="140" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c" font-weight="700">terminator</text><text x="20" y="180" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">Every char takes 1 byte, and the bytes sit side by side (contiguous).</text><text x="20" y="202" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">&#x27;\0&#x27; is the char with code 0 — it marks the end. It is NOT the digit &#x27;0&#x27;, whose code is 48.</text><text x="20" y="224" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">Without the &#x27;\0&#x27;, the bytes are just a collection of characters, not a string.</text></svg>
