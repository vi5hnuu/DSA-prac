<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="greet is an 8-byte array holding its own writable copy of Monsoon; p is a pointer holding the address of the literal Monsoon stored in read-only memory"><title>An array versus a pointer to a string literal</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="720" height="300" rx="12" fill="#f8fafc"/><text x="20" y="28" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">char greet[] = &quot;Monsoon&quot;;</text><text x="20" y="46" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#15803d">the array IS the 8 chars — its own copy, which you may change</text><text x="98" y="84.0" font-size="14" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">greet</text><rect x="110" y="62" width="52" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="136.0" y="85.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">M</text><rect x="162" y="62" width="52" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="188.0" y="85.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">o</text><rect x="214" y="62" width="52" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="240.0" y="85.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">n</text><rect x="266" y="62" width="52" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="292.0" y="85.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">s</text><rect x="318" y="62" width="52" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="344.0" y="85.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">o</text><rect x="370" y="62" width="52" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="396.0" y="85.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">o</text><rect x="422" y="62" width="52" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="448.0" y="85.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">n</text><rect x="474" y="62" width="52" height="34" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.6"/><text x="500.0" y="85.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">\0</text><text x="20" y="140" font-size="13" text-anchor="start" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">const char *p = &quot;Monsoon&quot;;</text><text x="20" y="158" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b91c1c">p only HOLDS the address of the literal, which lives in read-only memory</text><text x="75.0" y="188" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">p</text><rect x="30" y="196" width="90" height="34" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="75.0" y="218.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">5000</text><rect x="200" y="178" width="450" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><text x="210" y="194" font-size="11.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#475569" font-weight="700">read-only memory (string literals)</text><rect x="220" y="206" width="50" height="32" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="245.0" y="228.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">M</text><text x="245.0" y="254" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">5000</text><rect x="270" y="206" width="50" height="32" rx="0" fill="#ffffff" stroke="#47