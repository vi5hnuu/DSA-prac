hor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">n</text><text x="545.0" y="254" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">5006</text><rect x="570" y="206" width="50" height="32" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="595.0" y="228.0" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">\0</text><text x="595.0" y="254" font-size="11" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">5007</text><line x1="122" y1="213" x2="214" y2="220" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m_blue)"/><text x="20" y="286" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">greet[0] = &#x27;m&#x27; is fine.   Writing through p (p[0] = &#x27;m&#x27;) is undefined behaviour — on Linux it crashes.</text></svg>
