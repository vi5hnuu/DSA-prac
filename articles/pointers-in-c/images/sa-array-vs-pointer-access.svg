t x="20" y="286" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#2563eb">wp[3]: ① read the address stored in wp (9000)  ② move 3 places  ③ fetch the character there.</text><text x="20" y="308" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">Both give &#x27;l&#x27;, but the array needs one step less: its address is known; the pointer&#x27;s must be loaded first.</text></svg>
