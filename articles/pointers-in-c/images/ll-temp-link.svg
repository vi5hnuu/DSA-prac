liga&quot; 0" fill="#334155" font-weight="700">400</text><text x="170" y="92" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">150</text><rect x="300" y="40" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="323.0" y="61.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">27</text><rect x="346" y="40" width="40" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="366.0" y="61.0" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155" font-weight="700">700</text><text x="300" y="92" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">400</text><rect x="430" y="40" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="453.0" y="61.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">35</text><rect x="476" y="40" width="40" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="496.0" y="61.0" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155" font-weight="700">910</text><text x="430" y="92" font-size="11" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#334155">700</text><rect x="560" y="40" width="46" height="32" rx="0" fill="#dcfce7" st