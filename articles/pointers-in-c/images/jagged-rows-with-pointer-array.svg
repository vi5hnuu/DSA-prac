<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-label="An array week of three pointers; week[0] points to mon with 2 ints, week[1] to tue with 4 ints, and week[2] to wed with 1 int"><title>Rows of different lengths through an array of pointers</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect width="640" height="270" rx="12" fill="#f8fafc"/><text x="85" y="46" font-size="14" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">week</text><text x="32" y="85" font-size="12" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[0]</text><rect x="40" y="60" width="90" height="38" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="85" y="85" font-size="20" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">•</text><text x="216" y="85" font-size="13" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">mon</text><rect x="230" y="60" width="48" height="38" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="254" y="85" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">7</text><rect x="278" y="60" width="48" height="38" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="302" y="85" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">3</text><text x="338" y="85" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">length 2</text><line x1="92" y1="79" x2="182" y2="79" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="32" y="145" font-size="12" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[1]</text><rect x="40" y="120" width="90" height="38" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="85" y="145" font-size="20" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">•</text><text x="216" y="145" font-size="13" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">tue</text><rect x="230" y="120" width="48" height="38" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="254" y="145" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">5</text><rect x="278" y="120" width="48" height="38" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="302" y="145" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">9</text><rect x="326" y="120" width="48" height="38" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="350" y="145" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">2</text><rect x="374" y="120" width="48" height="38" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="398" y="145" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">8</text><text x="434" y="145" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">length 4</text><line x1="92" y1="139" x2="182" y2="139" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="32" y="205" font-size="12" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#475569">[2]</text><rect x="40" y="180" width="90" height="38" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="85" y="205" font-size="20" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">•</text><text x="216" y="205" font-size="13" text-anchor="end" font-family="JetBrains Mono,Consolas,monospace" style="font-variant-ligatures:none" fill="#0f172a" font-weight="700">wed</text><rect x="230" y="180" width="48" height="38" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="254" y="205" font-size="15" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a" font-weight="700">4</text><text x="290" y="205" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">length 1</text><line x1="92" y1="199" x2="182" y2="199" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="20" y="254" font-size="12" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#64748b">Each row can have its own length, which a 2-D array cannot do. Keep the lengths in a separate array.</text></svg>
