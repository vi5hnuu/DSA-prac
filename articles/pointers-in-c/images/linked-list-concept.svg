<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200" role="img" aria-label="Four nodes holding 82, 64, 47 and 91, each with a link to the next; the last link is NULL; head points to the first node"><title>A linked list of marks</title><defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="700" height="200" rx="12" fill="#f8fafc"/><rect x="107" y="60" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="130.0" y="81.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">82</text><rect x="153" y="60" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="221" y="60" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="244.0" y="81.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">64</text><rect x="267" y="60" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="335" y="60" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="358.0" y="81.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">47</text><rect x="381" y="60" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><rect x="449" y="60" width="46" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="472.0" y="81.0" font-size="13.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700">91</text><rect x="495" y="60" width="34" height="32" rx="0" fill="#dcfce7" stroke="#475569" stroke-width="1.8"/><text x="512.0" y="81.0" font-size="12" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#b91c1c" font-weight="700">N</text><line x1="170.0" y1="76.0" x2="219" y2="76.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="284.0" y1="76.0" x2="333" y2="76.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><line x1="398.0" y1="76.0" x2="447" y2="76.0" stroke="#475569" stroke-width="1.8" marker-end="url(#m_grey)"/><text x="130.0" y="50" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b" font-weight="700">data</text><text x="170.0" y="50" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b" font-weight="700">link</text><text x="40.0" y="52" font-size="13" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-variant-ligatures="none" style="font-variant-ligatures:none;font-feature-settings:&quot;liga&quot; 0,&quot;calt&quot; 0" fill="#0f172a" font-weight="700">head</text><rect x="10" y="60" width="60" height="32" rx="6" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="40.0" y="81.0" font-size="14" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a" font-weight="700"></text><line x1="72" y1="76" x2="105" y2="76" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m_blue)"/><text x="147" y="116" font-size="11.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#64748b">◄── one node ──►</text><text x="20" y="160" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">Each node = data + link (the address of the next node). N marks a NULL link: the end of the list.</text><text x="20" y="182" font-size="12.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" style="font-feature-settings:&quot;calt&quot; 0,&quot;liga&quot; 0" fill="#0f172a">The nodes can be anywhere in memory; only the links say which comes next.</text></svg>
